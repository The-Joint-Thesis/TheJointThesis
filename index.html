<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0c0b09;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    overflow: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .label {
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #a08840;
    font-family: Georgia, serif;
    margin-bottom: 1.8rem;
    animation: up 1s ease 0.3s both;
    text-shadow: 0 0 18px rgba(240, 210, 120, 0.3);
  }

  h1 {
    font-size: clamp(3rem, 9vw, 6rem);
    font-weight: 300;
    line-height: 1;
    color: #f0e08a;
    letter-spacing: 0.02em;
    animation: up 1.1s ease 0.5s both;
    text-shadow:
      0 0 20px rgba(240, 220, 100, 0.6),
      0 0 60px rgba(220, 180, 60, 0.3),
      0 0 100px rgba(200, 150, 40, 0.15);
  }

  .rule {
    width: 40px;
    height: 1px;
    background: #7a6030;
    margin: 2rem auto;
    animation: expand 1.2s ease 0.9s both;
    box-shadow: 0 0 8px rgba(200, 160, 60, 0.4);
  }

  .sub {
    font-size: 1rem;
    font-weight: 300;
    color: #8a7040;
    letter-spacing: 0.08em;
    animation: up 1s ease 1.1s both;
    text-shadow: 0 0 14px rgba(220, 190, 80, 0.2);
  }

  @keyframes up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes expand {
    from { width: 0; opacity: 0; }
    to   { width: 40px; opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="wrap">
  <p class="label">We'll be back soon</p>
  <h1>Under<br>Construction</h1>
  <div class="rule"></div>
  <p class="sub">Something is being built.</p>
</div>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
let W, H, t = 0;

function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

function draw() {
  x.clearRect(0, 0, W, H);
  for (let i = 0; i < 5; i++) {
    const phase = (i / 5) * Math.PI * 2;
    const y = H * 0.5 + Math.sin(t * 0.004 + phase) * H * 0.06;
    x.beginPath();
    x.moveTo(0, y);
    for (let px = 0; px <= W; px += 4) {
      const py = y + Math.sin((px / W) * Math.PI * 3 + t * 0.006 + phase) * 18;
      x.lineTo(px, py);
    }
    x.strokeStyle = `rgba(180, 130, 50, ${0.03 + i * 0.012})`;
    x.lineWidth = 1;
    x.stroke();
  }
  t++;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
